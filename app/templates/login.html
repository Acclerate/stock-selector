<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>量化选股 — 登录</title>
  <style>
    :root{
      --bg:#f5f6f8;--bg-card:#fff;--border:#e5e7eb;
      --text:#1f2937;--text-sec:#6b7280;
      --accent:#4f46e5;--accent-hover:#4338ca;
      --radius:10px
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
      background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;
      min-height:100vh
    }
    .box{
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--radius);padding:40px;width:360px;
      box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)
    }
    .logo{text-align:center;margin-bottom:28px}
    .logo .diamond{color:var(--accent);font-size:1.2rem}
    .logo h2{font-size:1.3rem;font-weight:600;color:var(--text);margin-top:6px}
    label{font-size:.82rem;color:var(--text-sec);font-weight:500;display:block;margin-bottom:6px}
    input{
      width:100%;padding:10px 12px;margin-bottom:18px;
      background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
      color:var(--text);font-size:.92rem;font-family:inherit;outline:none;
      transition:border .2s
    }
    input:focus{border-color:var(--accent)}
    button{
      width:100%;padding:11px;background:var(--accent);border:none;border-radius:var(--radius);
      color:#fff;font-size:.95rem;font-weight:500;cursor:pointer;font-family:inherit;
      transition:background .2s
    }
    button:hover{background:var(--accent-hover)}
    .err{color:#dc2626;font-size:.82rem;margin-bottom:12px;text-align:center}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <div class="diamond">&#9670;</div>
      <h2>量化选股引擎</h2>
    </div>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="POST">
      <label>用户名</label>
      <input type="text" name="username" autofocus>
      <label>密码</label>
      <input type="password" name="password">
      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
